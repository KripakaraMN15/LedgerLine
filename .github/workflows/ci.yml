name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vendorops
          POSTGRES_USER: vendorops
          POSTGRES_PASSWORD: vendorops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendorops -d vendorops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vendorops:vendorops@localhost:5432/vendorops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Run tests
        run: pytest tests/unit tests/integration -q
