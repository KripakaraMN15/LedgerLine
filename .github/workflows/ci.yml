name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vendorops
          POSTGRES_USER: vendorops
          POSTGRES_PASSWORD: vendorops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendorops -d vendorops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vendorops:vendorops@localhost:5432/vendorops
      REQUIRE_DB: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Validate Docker Compose
        env:
          VENDOROPS_API_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose config

      - name: Build mock service images
        env:
          VENDOROPS_API_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose build mock-llm mock-vendor

      - name: Test sandbox executor
        env:
          REQUIRE_DOCKER: '1'
        run: |
          docker pull python:3.11.14-slim
          pytest tests/unit/test_sandbox.py -q

      - name: Run tests
        run: pytest tests/unit tests/integration -q

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      VENDOROPS_API_KEY: ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Submit task, await completion, and verify Phoenix trace
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "http://localhost:8000"
          headers = {"X-API-Key": "${{ env.VENDOROPS_API_KEY }}"}

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=5) as response:
                  return json.loads(response.read())

          deadline = time.monotonic() + 180
          while True:
              try:
                  get(base + "/readyz")
                  break
              except (OSError, urllib.error.HTTPError):
                  if time.monotonic() >= deadline:
                      raise RuntimeError("API did not become ready")
                  time.sleep(2)

          body = json.dumps({
              "goal": "Review vendor V-42 and reconcile invoices.",
              "idempotency_key": "compose-smoke-task",
          }).encode()
          request = urllib.request.Request(
              base + "/tasks",
              data=body,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              task_id = json.loads(response.read())["task_id"]

          deadline = time.monotonic() + 120
          while True:
              task = get(base + "/tasks/" + task_id)
              if task["status"] == "done":
                  break
              if task["status"] in {"failed", "killed", "cancelled"}:
                  raise RuntimeError(f"Smoke task ended as {task['status']}")
              if time.monotonic() >= deadline:
                  raise RuntimeError("Smoke task did not complete")
              time.sleep(1)

          deadline = time.monotonic() + 90
          while True:
              trace_found = False
              for project in ("vendorops", "default"):
                  phoenix = (
                      "http://localhost:6006/v1/projects/"
                      + urllib.parse.quote(project, safe="")
                      + "/spans/otlpv1?"
                  )
                  query = urllib.parse.urlencode(
                      {"trace_id": task["trace_id"], "limit": 100}
                  )
                  try:
                      with urllib.request.urlopen(phoenix + query, timeout=5) as response:
                          spans = response.read().decode()
                      if task["trace_id"] in spans:
                          print("Phoenix received trace", task["trace_id"])
                          trace_found = True
                          break
                  except urllib.error.HTTPError as error:
                      if error.code not in {404, 422}:
                          raise
                  except OSError:
                      pass
              if trace_found:
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError("Phoenix did not expose the task trace")
              time.sleep(3)
          PY

      - name: Print Compose logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v
