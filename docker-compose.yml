version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: vendorops
      POSTGRES_USER: vendorops
      POSTGRES_PASSWORD: vendorops
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendorops -d vendorops']
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - '6006:6006'
      - '4317:4317'

  mock-llm:
    build:
      context: .
      dockerfile: mocks/mock_llm/Dockerfile
    ports:
      - '8001:8001'

  mock-vendor:
    build:
      context: .
      dockerfile: mocks/mock_vendor_api/Dockerfile
    ports:
      - '8002:8002'

  app:
    build:
      context: .
    command: uvicorn vendorops.api.app:app --host 0.0.0.0 --port 8000
    environment:
      OTEL_SERVICE_NAME: vendorops
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      - postgres
      - phoenix
      - mock-llm
      - mock-vendor
    ports:
      - '8000:8000'
